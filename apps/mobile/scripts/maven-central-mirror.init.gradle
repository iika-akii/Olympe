// Redirige Maven Central vers le miroir officiel de Google.
// Raison : derrière un proxy partagé, repo.maven.apache.org répond souvent « 429 Too Many Requests »,
// y compris via le portail des plugins Gradle (qui redirige vers Maven Central), et Gradle
// ne bascule pas sur un autre dépôt après un 429.
def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
def MIRROR_NAME = 'mavenCentralMirror'

// Remplace l'URL de Maven Central par le miroir.
def redirect = { RepositoryHandler repos ->
  repos.configureEach { repo ->
    if (repo instanceof MavenArtifactRepository) {
      def url = repo.url.toString()
      if (url.startsWith('https://repo.maven.apache.org/maven2') || url.startsWith('https://repo1.maven.org/maven2')) {
        repo.url = MIRROR
      }
    }
  }
}

// Place le miroir en tête : un artefact absent du miroir (marqueur de plugin) renvoie 404 et Gradle passe au suivant.
def preferMirror = { RepositoryHandler repos ->
  if (repos.findByName(MIRROR_NAME) == null) {
    def mirror = repos.maven { name = MIRROR_NAME; url = MIRROR }
    repos.remove(mirror)
    repos.addFirst(mirror)
  }
  redirect(repos)
}

beforeSettings { settings ->
  preferMirror(settings.pluginManagement.repositories)
  preferMirror(settings.buildscript.repositories)
  redirect(settings.dependencyResolutionManagement.repositories)
}

allprojects { project ->
  preferMirror(project.buildscript.repositories)
  redirect(project.repositories)
}
